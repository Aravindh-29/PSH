version: '3.9'

# ─────────────────────────────────────────────────────────────────────────────
# Pure Storage Horizon — Ticketing System
# Usage:  docker compose up --build
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:17-alpine
    container_name: psh-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: psh_ticketing
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d psh_ticketing"]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 10s
    networks:
      - psh-net

  # ── DB Init (runs once, seeds schema + users) ───────────────────────────────
  db-init:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: psh-db-init
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/psh_ticketing
      NODE_ENV: production
    command: node database/init.js
    working_dir: /app
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - psh-net
    restart: "no"

  # ── Application (Express + React static) ────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: psh-app
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/psh_ticketing
      SESSION_SECRET: psh-super-secret-change-in-production-2024
      NODE_ENV: production
      PORT: "5000"
      CLIENT_URL: http://localhost:5000
    depends_on:
      postgres:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    networks:
      - psh-net

volumes:
  postgres_data:
    driver: local

networks:
  psh-net:
    driver: bridge
